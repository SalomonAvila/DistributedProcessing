# ──────────────────────────────────────────────────────────────────────
# SOLO PARA DESARROLLO LOCAL
#
# Este archivo NO representa la topología real de producción, que es
# Kubernetes (ver docs/02-arquitectura.typ). No tiene healthchecks ni
# probes, por lo que NO sirve para validar tolerancia a fallos ni
# recuperación de procesos. Para esas pruebas, usar los manifiestos
# de Kubernetes (Épica 4).
# ──────────────────────────────────────────────────────────────────────

services:

  master:
    build:
      context: .
      dockerfile: Dockerfile
      target: master

    container_name: master

    ports:
      - "50051:50051"

    environment:
      MASTER_PORT: "50051"
      WORKERS: "worker-1:50051,worker-2:50051,worker-3:50051"
      HEARTBEAT_TIMEOUT_SECONDS: "5"

    depends_on:
      - worker-1
      - worker-2
      - worker-3

    networks:
      - system-network


  worker-1:
    build:
      context: .
      dockerfile: Dockerfile
      target: worker

    container_name: worker-1

    environment:
      WORKER_ID: "worker-1"
      WORKER_PORT: "50051"
      MASTER_ADDRESS: "master:50051"
      TASK_DURATION_MS: "100"

    networks:
      - system-network


  worker-2:
    build:
      context: .
      dockerfile: Dockerfile
      target: worker

    container_name: worker-2

    environment:
      WORKER_ID: "worker-2"
      WORKER_PORT: "50051"
      MASTER_ADDRESS: "master:50051"
      TASK_DURATION_MS: "100"

    networks:
      - system-network


  worker-3:
    build:
      context: .
      dockerfile: Dockerfile
      target: worker

    container_name: worker-3

    environment:
      WORKER_ID: "worker-3"
      WORKER_PORT: "50051"
      MASTER_ADDRESS: "master:50051"
      TASK_DURATION_MS: "100"

    networks:
      - system-network


networks:
  system-network:
    driver: bridge
