# El master corre fijo en el nodo físico "worker1" (nodeSelector), como
# un único Deployment: no hay razón para más de una réplica (es un
# punto de coordinación central, no horizontalmente escalable).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: master
  namespace: distributed-processing
  labels:
    app: master
spec:
  replicas: 1
  selector:
    matchLabels:
      app: master
  template:
    metadata:
      labels:
        app: master
    spec:
      nodeSelector:
        kubernetes.io/hostname: worker1
      # worker1 es el control-plane (taint node-role.kubernetes.io/control-plane:NoSchedule).
      # Se tolera puntualmente para este pod en vez de sacar el taint del
      # nodo, así el resto del clúster no queda abierto a cualquier carga.
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
      # Solo necesario si el paquete en GHCR quedó privado (ver k8s/README.md).
      # imagePullSecrets:
      #   - name: ghcr-pull-secret
      containers:
        - name: master
          image: ghcr.io/salomonavila/distributedprocessing-master:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 50051
              name: grpc
          env:
            - name: MASTER_PORT
              value: "50051"
            # DNS estable de cada pod del StatefulSet "worker" (ver
            # worker-statefulset.yaml): <pod>.<service-headless>.
            - name: WORKERS
              value: "worker-0.worker:50051,worker-1.worker:50051"
            # Subido de 5s a 12s: en el cluster real (red overlay entre
            # nodos físicos) el worker abre una conexión gRPC nueva en
            # cada heartbeat, y 5s alcanzaba para declarar DEAD a un
            # worker con un solo heartbeat perdido (ver k8s/README.md).
            - name: HEARTBEAT_TIMEOUT_SECONDS
              value: "12"
            # Los CSV viven solo en el master (los workers reciben cada
            # chunk por gRPC). Se montan desde el disco del nodo worker1
            # (ver volumen "datasets" abajo).
            - name: DATA_PROCESOS_PATH
              value: "/data/procesos-de-contratacion.csv"
            - name: DATA_CONTRATOS_PATH
              value: "/data/contratos-electronicos.csv"
          volumeMounts:
            - name: datasets
              mountPath: /data
              readOnly: true
          # No existe (todavía) un health check gRPC dedicado
          # (grpc.health.v1); tcpSocket es un chequeo mínimo de que el
          # puerto está escuchando. Reemplazar por un exec grpc_health_probe
          # cuando se implemente el servicio de salud.
          readinessProbe:
            tcpSocket:
              port: 50051
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            tcpSocket:
              port: 50051
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "1"
              memory: "512Mi"
      # hostPath es válido acá porque el pod está fijado a worker1 por
      # nodeSelector: los CSV (20-40GB) se copian una sola vez a ese
      # directorio del nodo, en vez de meterlos en la imagen o en un PV.
      # type: Directory hace que el pod no arranque si la carpeta no
      # existe, en lugar de crear una vacía y fallar al abrir los CSV.
      volumes:
        - name: datasets
          hostPath:
            path: /srv/distributed-processing/data
            type: Directory
---
apiVersion: v1
kind: Service
metadata:
  name: master
  namespace: distributed-processing
spec:
  selector:
    app: master
  ports:
    - port: 50051
      targetPort: 50051
      name: grpc
