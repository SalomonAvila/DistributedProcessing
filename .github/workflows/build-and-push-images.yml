name: Build and Push Images

# Reemplaza el docker login/push manual: usa el GITHUB_TOKEN de Actions
# (con permiso packages: write) para autenticar contra ghcr.io, así no
# hace falta un Personal Access Token ni correr esto en ninguna máquina
# local. Debe correr contra el mismo nombre de imagen que ya referencian
# k8s/master-deployment.yaml y k8s/worker-statefulset.yaml.

on:
  push:
    branches: [main, develop]
    paths:
      - "Dockerfile"
      - "src/**"
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        component: [master, worker]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push ${{ matrix.component }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          target: ${{ matrix.component }}
          push: true
          tags: |
            ghcr.io/salomonavila/distributedprocessing-${{ matrix.component }}:latest
            ghcr.io/salomonavila/distributedprocessing-${{ matrix.component }}:${{ github.sha }}
