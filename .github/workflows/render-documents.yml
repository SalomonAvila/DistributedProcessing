name: Render Documents

on:
  push:
    branches:
      - main
    paths:
      - "docs/**/*.typ"
      - "docs/**/*.drawio"
      - ".github/workflows/render-documents.yml"

permissions:
  contents: write

concurrency:
  group: render-documents-${{ github.ref }}
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Export .drawio files to PNG
        uses: rlespinasse/drawio-export-action@v2
        with:
          path: docs
          format: png
          output: RenderedDocuments

      - name: Setup Typst
        uses: typst-community/setup-typst@v5

      - name: Compile .typ files to PDF
        run: |
          mkdir -p RenderedDocuments
          find docs -name "*.typ" -print0 | while IFS= read -r -d '' file; do
            name=$(basename "$file" .typ)
            typst compile "$file" "RenderedDocuments/${name}.pdf"
          done

      - name: Consolidate rendered PNGs into top-level RenderedDocuments
        run: |
          mkdir -p RenderedDocuments
          while IFS= read -r -d '' dir; do
            find "$dir" -name "*.png" -exec mv -f {} RenderedDocuments/ \;
            rmdir "$dir" 2>/dev/null || true
          done < <(find . -type d -name RenderedDocuments -not -path "./RenderedDocuments" -print0)

      - name: Commit rendered documents
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: "chore: actualizar RenderedDocuments (typst + drawio)"
          file_pattern: "RenderedDocuments/**"
